<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>BL4 Parts Stats Catalog — Scooter's Toolbox</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" sizes="any" type="image/x-icon" href="./favicon.ico" />
  <script src="./js/cc-browser-compat.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg-base: #060a12;
      --bg-panel: rgba(5, 12, 24, 0.75);
      --accent-cyan: #00f3ff;
      --text-primary: rgba(255, 255, 255, 0.92);
      --text-secondary: rgba(255, 255, 255, 0.72);
      --radius-panel: 10px;
      --radius-btn: 8px;
      --shadow-depth: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font: 13px/1.45 system-ui, Segoe UI, Roboto, sans-serif;
      color: var(--text-primary);
      background: linear-gradient(165deg, #050a14 0%, #060a12 100%);
    }
    html.stx-lite-ui body { background: var(--bg-base); }
    .app-shell { max-width: 1500px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
    .header-bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: var(--radius-panel);
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.06) 0%, rgba(255, 0, 200, 0.04) 100%);
      border: 1px solid rgba(0, 243, 255, 0.2); box-shadow: var(--shadow-depth);
    }
    .header-main h1 {
      margin: 0 0 4px;
      font-size: clamp(1.12rem, 2.2vw, 1.42rem);
      color: var(--accent-cyan);
    }
    .header-main p { margin: 0; color: var(--text-secondary); font-size: 0.92rem; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: var(--radius-btn);
      border: 1px solid rgba(255, 255, 255, 0.2); text-decoration: none;
      background: rgba(255, 255, 255, 0.06); color: var(--text-primary); font-size: 12px; font-weight: 600;
    }
    .btn--brand {
      border-color: rgba(255, 0, 200, 0.5);
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25) 0%, rgba(255, 0, 200, 0.2) 100%);
      color: #fff;
    }
    .panel {
      background: var(--bg-panel); border: 1px solid rgba(0, 243, 255, 0.15); border-radius: var(--radius-panel);
      box-shadow: var(--shadow-depth); padding: 12px 14px;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
    input, select, button {
      background: rgba(6, 12, 24, 0.95); color: var(--text-primary); border: 1px solid rgba(0, 243, 255, 0.24);
      border-radius: var(--radius-btn); padding: 8px 10px; font: inherit;
    }
    input[type="text"] { min-width: min(320px, 100%); flex: 1; }
    html.stx-touch-ui input[type="text"], html.stx-touch-ui select { font-size: 16px; min-height: 44px; }
    button { cursor: pointer; touch-action: manipulation; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .pill {
      background: rgba(0, 243, 255, 0.06); border: 1px solid rgba(0, 243, 255, 0.2);
      color: var(--text-secondary); border-radius: 999px; padding: 4px 10px;
    }
    .only-stats { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12px; }
    #list { display: grid; gap: 8px; }
    .part-card {
      background: rgba(12, 20, 38, 0.92); border: 1px solid rgba(0, 243, 255, 0.15); border-radius: var(--radius-panel);
      overflow: hidden;
    }
    summary {
      display: flex; gap: 10px; align-items: center; cursor: pointer; list-style: none;
      padding: 9px 10px;
      background: linear-gradient(90deg, rgba(0, 243, 255, 0.04), rgba(255, 0, 200, 0.03));
    }
    summary::-webkit-details-marker { display: none; }
    .code { font-family: Consolas, monospace; color: #7ff4ff; word-break: break-word; }
    .meta { color: #b9c7e8; flex: 1; min-width: 0; }
    .count { margin-left: auto; color: #a9f8ca; flex-shrink: 0; }
    .meta-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px;
      padding: 10px;
    }
    .mono { font-family: Consolas, monospace; }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
    th, td { border-top: 1px solid rgba(0, 243, 255, 0.12); padding: 6px 8px; text-align: left; vertical-align: top; }
    th { color: #c4d7ff; }
    .num { text-align: right; }
    .no-stats { margin: 0 10px 10px; color: #ffb4b4; font-size: 12px; }
    .empty, #loading {
      padding: 14px; border: 1px dashed rgba(0, 243, 255, 0.35); border-radius: 8px; color: #b7c5e8;
      background: rgba(10, 18, 35, 0.5);
    }
    #loadMore { width: 100%; margin-top: 4px; }
    .impact-badge { color: #ffd48a; font-weight: 600; }
    .stat-row-match { background: rgba(0, 243, 255, 0.08); }
    .stat-row-match td:first-child { color: #9ff8ff; }
    #sortHint {
      margin: 8px 0 0;
      font-size: 11px;
      color: rgba(0, 243, 255, 0.75);
      display: none;
    }
  </style>
  <script defer src="./data/stx_dataset.js"></script>
  <script defer src="./data/stx_dataset_supplement.js"></script>
  <script defer src="./data/stx_raid2_supplement.js"></script>
  <script defer src="./data/parts_stats_data.js"></script>
  <script defer src="./js/parts-stats-catalog-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header-bar">
      <div class="header-main">
        <h1>BL4 Parts Stats Catalog</h1>
        <p id="catalogMeta">Loading dataset…</p>
      </div>
      <div class="header-actions">
        <a class="btn btn--brand" href="../index.html">Full toolbox</a>
        <a class="btn btn--brand" href="./stx-save-yaml-full.html">Save / YAML page</a>
      </div>
    </header>

    <section class="panel">
      <div class="controls">
        <input id="q" type="text" placeholder="Search part code, name, field, bucket, family…" />
        <select id="cat"><option value="">All categories</option></select>
        <select id="mfr"><option value="">All manufacturers</option></select>
        <select id="slot"><option value="">All slots</option></select>
        <button id="expand" type="button">Expand shown</button>
        <button id="collapse" type="button">Collapse shown</button>
        <label class="only-stats"><input id="onlyStats" type="checkbox" checked /> Only parts with stats</label>
      </div>
      <div class="stats">
        <span class="pill">Dataset parts: <b id="totalCount">—</b></span>
        <span class="pill">With stats: <b id="withStatsCount">—</b></span>
        <span class="pill">Matching filter: <b id="visibleCount">—</b></span>
        <span class="pill">Stat rows (shown batch): <b id="rowCount">—</b></span>
      </div>
      <p id="sortHint" aria-live="polite"></p>
    </section>

    <div id="loading">Loading parts and stat tables…</div>
    <div id="list"></div>
    <button id="loadMore" type="button" style="display:none">Load more</button>
    <div id="empty" class="empty" style="display:none">No parts match current filters.</div>
  </div>
</body>
</html>
